<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="loading">Loading Solar System...</div>

    <div class="info-panel">
        <h1>☀️ Solar System Explorer</h1>
        <div id="selectedPlanetInfo">
            <div class="planet-info">Click on a planet to learn more</div>
        </div>
    </div>

    <div class="controls">
        <div class="control-item"><strong>🖱️ Controls:</strong></div>
        <div class="control-item">• Drag to rotate</div>
        <div class="control-item">• Scroll to zoom</div>
        <div class="control-item">• Click planets for info</div>
        <div class="control-item"><strong>Keys:</strong></div>
        <div class="control-item">• SPACE: pause/play</div>
        <div class="control-item">• R: reset view</div>
        <div class="control-item">• +/-: speed control</div>
    </div>

    <div class="stats">
        <div><span class="stat-label">FPS:</span><span id="fps">60</span></div>
        <div><span class="stat-label">Planets:</span><span id="planetCount">8</span></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
